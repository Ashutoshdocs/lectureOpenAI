# TEMPLATE ONLY — do NOT put your real key here and commit it.
# The recommended way to create the Secret is with kubectl (no file on disk):
#
#   kubectl -n ai-studio create secret generic ai-studio-secret \
#     --from-literal=OPENAI_API_KEY="sk-your-real-key"
#
# If you prefer a file, copy this to secret.yaml, fill in stringData, and keep it
# out of git (secret.yaml is already in .gitignore).
apiVersion: v1
kind: Secret
metadata:
  name: ai-studio-secret
  namespace: ai-studio
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-your-real-key"
