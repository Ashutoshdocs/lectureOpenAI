# Exposes the pods inside the cluster and gives them one stable address.
# type: NodePort makes it reachable from outside on a node port (great for a
# self-managed cluster / VM). Switch to LoadBalancer on a cloud provider.
apiVersion: v1
kind: Service
metadata:
  name: ai-studio
  namespace: ai-studio
  labels:
    app: ai-studio
spec:
  type: NodePort
  selector:
    app: ai-studio
  ports:
    - name: http
      port: 80            # service port inside the cluster
      targetPort: 8000    # container port
      nodePort: 30080     # reachable at http://<node-ip>:30080
