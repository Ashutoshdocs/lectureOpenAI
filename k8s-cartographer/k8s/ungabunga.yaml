apiVersion: v1
kind: Namespace
metadata:
  name: ungabunga

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-cartographer
  namespace: ungabunga
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-cartographer
  template:
    metadata:
      labels:
        app: k8s-cartographer
    spec:
      containers:
        - name: k8s-cartographer
          image: k8s-cartographer:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: k8s-cartographer
  namespace: ungabunga
spec:
  type: NodePort
  selector:
    app: k8s-cartographer
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080